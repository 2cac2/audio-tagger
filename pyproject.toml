[project]
name = "audio-tagger"
version = "0.1.0"
description = "AI metadata harness for Indian (Bollywood / Punjabi / indipop) music libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "musicbrainzngs>=0.7.1",   # MusicBrainz source (keyless)
    "mutagen>=1.47",           # reading/writing tags
]

[project.optional-dependencies]
# Everything below is optional; the harness runs with just the core deps.
fingerprint = ["pyacoustid>=1.3"]     # AcoustID fingerprinting (needs fpcalc binary)
spotify = ["requests>=2.31"]          # Spotify + Discogs sources
fallback = ["anthropic>=0.40", "ddgs>=6.0"]  # example web-search fallback wiring
dev = ["pytest>=8.0"]

[project.scripts]
audio-tagger = "audio_tagger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audio_tagger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
